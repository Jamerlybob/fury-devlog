<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#e6efe8">
  <rect width="680" height="340" rx="6" fill="#0b2a1d"/>
  <text x="20" y="28" font-size="15" fill="#5fe0a0">The coat check: how a match server decides to let you in</text>

  <!-- actors -->
  <rect x="20"  y="55" width="150" height="34" fill="#14432f" stroke="#5fe0a0"/>
  <text x="95"  y="77" font-size="12" text-anchor="middle" fill="#5fe0a0">master server</text>
  <rect x="265" y="55" width="150" height="34" fill="#14432f" stroke="#5fe0a0"/>
  <text x="340" y="77" font-size="12" text-anchor="middle" fill="#5fe0a0">match server</text>
  <rect x="510" y="55" width="150" height="34" fill="#14432f" stroke="#5fe0a0"/>
  <text x="585" y="77" font-size="12" text-anchor="middle" fill="#5fe0a0">your client</text>

  <!-- lifelines -->
  <line x1="95"  y1="89" x2="95"  y2="315" stroke="#14432f" stroke-dasharray="2 4"/>
  <line x1="340" y1="89" x2="340" y2="315" stroke="#14432f" stroke-dasharray="2 4"/>
  <line x1="585" y1="89" x2="585" y2="315" stroke="#14432f" stroke-dasharray="2 4"/>

  <!-- step 1 -->
  <text x="20" y="120" font-size="11" fill="#9dc4b2">1. before you connect</text>
  <path d="M97 138 L338 138" stroke="#5fe0a0" fill="none" marker-end="url(#h)"/>
  <text x="217" y="132" font-size="10.5" text-anchor="middle">"expect avatar 4291, key = a3f9c1..."</text>

  <!-- match server holds a list -->
  <rect x="250" y="152" width="180" height="42" fill="none" stroke="#5cb98a"/>
  <text x="340" y="169" font-size="10" text-anchor="middle" fill="#9dc4b2">pending players (with a timer)</text>
  <text x="340" y="185" font-size="10.5" text-anchor="middle">4291 &#183; a3f9c1... &#183; 20s</text>

  <!-- step 2 -->
  <text x="20" y="228" font-size="11" fill="#9dc4b2">2. you connect</text>
  <path d="M583 246 L342 246" stroke="#5fe0a0" fill="none" marker-end="url(#h)"/>
  <text x="462" y="240" font-size="10.5" text-anchor="middle">connect ?SessionKey=a3f9c1...</text>

  <!-- step 3 -->
  <text x="20" y="286" font-size="11" fill="#9dc4b2">3. match server checks the list</text>
  <path d="M342 300 L583 300" stroke="#5fe0a0" fill="none" marker-end="url(#h)"/>
  <text x="462" y="294" font-size="10.5" text-anchor="middle" fill="#5fe0a0">key found &#8594; "you're in, avatar 4291"</text>
  <text x="462" y="318" font-size="10.5" text-anchor="middle" fill="#e0a34f">not found &#8594; kicked with "WRONGSID"</text>

  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5fe0a0"/>
    </marker>
  </defs>
</svg>
