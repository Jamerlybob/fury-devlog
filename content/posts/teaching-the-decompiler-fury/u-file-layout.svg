<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <rect width="680" height="290" rx="6" fill="#0b2a1d"/>
  <text x="24" y="30" font-size="15" fill="#5fe0a0">A .u file is like a .zip full of code</text>
  <text x="24" y="50" font-size="11" fill="#9dc4b2">GOGame.u is ~9.5 MB and its table of contents lists nearly 50,000 entries</text>

  <g text-anchor="middle">
    <rect x="24"  y="70" width="150" height="120" rx="4" fill="none" stroke="#9dc4b2"/>
    <text x="99"  y="118" font-size="12">header</text>
    <text x="99"  y="138" font-size="9" fill="#9dc4b2">"I am UE3 v407"</text>

    <rect x="180" y="70" width="150" height="120" rx="4" fill="none" stroke="#9dc4b2"/>
    <text x="255" y="112" font-size="12">name table</text>
    <text x="255" y="132" font-size="9" fill="#9dc4b2">every string used</text>
    <text x="255" y="144" font-size="9" fill="#9dc4b2">in the file</text>

    <rect x="336" y="70" width="150" height="120" rx="4" fill="none" stroke="#9dc4b2"/>
    <text x="411" y="112" font-size="12">export table</text>
    <text x="411" y="132" font-size="9" fill="#9dc4b2">one row per class,</text>
    <text x="411" y="144" font-size="9" fill="#9dc4b2">function, variable</text>

    <rect x="492" y="70" width="164" height="120" rx="4" fill="#14432f" stroke="#5fe0a0"/>
    <text x="574" y="118" font-size="12" fill="#5fe0a0">the actual code</text>
    <text x="574" y="138" font-size="9" fill="#9dc4b2">bytecode, packed tight</text>
  </g>

  <!-- auran additions -->
  <path d="M120 190 L120 210" stroke="#e0a34f" fill="none" marker-end="url(#u)"/>
  <text x="120" y="228" font-size="9.5" text-anchor="middle" fill="#e0a34f">+4 bytes right</text>
  <text x="120" y="240" font-size="9.5" text-anchor="middle" fill="#e0a34f">after the GUID</text>

  <path d="M411 190 L411 210" stroke="#e0a34f" fill="none" marker-end="url(#u)"/>
  <text x="411" y="228" font-size="9.5" text-anchor="middle" fill="#e0a34f">+4 bytes on the end of</text>
  <text x="411" y="240" font-size="9.5" text-anchor="middle" fill="#e0a34f">every single row</text>

  <text x="24" y="272" font-size="11" fill="#9dc4b2">Auran sprinkled little extra fields (checksums, best guess) through a mostly-standard format.</text>

  <defs>
    <marker id="u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0a34f"/></marker>
  </defs>
</svg>
