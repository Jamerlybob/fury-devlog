<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#e6efe8">
  <rect width="680" height="300" rx="6" fill="#0b2a1d"/>
  <text x="20" y="30" font-size="15" fill="#5fe0a0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">The extra 4 bytes, and why the tool walked off the end</text>

  <!-- stock row -->
  <text x="20" y="70" font-size="12" fill="#9dc4b2">stock Unreal Engine 3 (v407)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20"  y="80" width="90"  height="34" fill="none" stroke="#5cb98a"/>
    <text x="65"  y="101">signature</text>
    <rect x="110" y="80" width="70"  height="34" fill="none" stroke="#5cb98a"/>
    <text x="145" y="101">versions</text>
    <rect x="180" y="80" width="150" height="34" fill="none" stroke="#5cb98a"/>
    <text x="255" y="101">package GUID (16)</text>
    <rect x="330" y="80" width="110" height="34" fill="none" stroke="#5fe0a0"/>
    <text x="385" y="97">generations</text>
    <text x="385" y="109" fill="#5fe0a0">= 2</text>
    <rect x="440" y="80" width="120" height="34" fill="none" stroke="#5cb98a" stroke-dasharray="3 3"/>
    <text x="500" y="101" fill="#9dc4b2">rest of header</text>
  </g>
  <text x="385" y="135" font-size="10" text-anchor="middle" fill="#9dc4b2">tool reads the count here. gets 2. fine.</text>

  <!-- fury row -->
  <text x="20" y="185" font-size="12" fill="#9dc4b2">Fury (build 35256)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20"  y="195" width="90"  height="34" fill="none" stroke="#5cb98a"/>
    <text x="65"  y="216">signature</text>
    <rect x="110" y="195" width="70"  height="34" fill="none" stroke="#5cb98a"/>
    <text x="145" y="216">versions</text>
    <rect x="180" y="195" width="150" height="34" fill="none" stroke="#5cb98a"/>
    <text x="255" y="216">package GUID (16)</text>
    <rect x="330" y="195" width="90" height="34" fill="#14432f" stroke="#e0a34f"/>
    <text x="375" y="212" fill="#e0a34f">checksum?</text>
    <text x="375" y="224" fill="#e0a34f">(4, new)</text>
    <rect x="420" y="195" width="110" height="34" fill="none" stroke="#5fe0a0"/>
    <text x="475" y="212">generations</text>
    <text x="475" y="224" fill="#5fe0a0">= 2</text>
    <rect x="530" y="195" width="120" height="34" fill="none" stroke="#5cb98a" stroke-dasharray="3 3"/>
    <text x="590" y="216" fill="#9dc4b2">rest of header</text>
  </g>
  <path d="M375 250 L375 233" stroke="#e0a34f" fill="none" marker-end="url(#a)"/>
  <text x="375" y="266" font-size="10" text-anchor="middle" fill="#e0a34f">tool still reads the count here</text>
  <text x="375" y="280" font-size="10" text-anchor="middle" fill="#e0a34f">gets 1,359,147,804 &#8594; tries to read 1.3 billion things &#8594; EOF</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0a34f"/>
    </marker>
  </defs>
</svg>
