<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9dc4b2"/></marker>
  </defs>
  <rect width="680" height="300" rx="6" fill="#0b2a1d"/>
  <text x="24" y="28" font-size="14" fill="#5fe0a0">How a real Fury server put you into a match: the hotel</text>

  <g font-size="12" fill="#9dc4b2">
    <text x="24" y="72">matchmaker</text>
    <text x="24" y="142">arena server</text>
    <text x="24" y="222">your client</text>
  </g>
  <line x1="120" y1="68" x2="656" y2="68" stroke="#2e5c46"/>
  <line x1="120" y1="138" x2="656" y2="138" stroke="#2e5c46"/>
  <line x1="120" y1="218" x2="656" y2="218" stroke="#2e5c46"/>

  <rect x="128" y="52" width="130" height="32" rx="4" fill="#15402c" stroke="#5fe0a0"/>
  <text x="193" y="72" font-size="11" text-anchor="middle">sends your dossier</text>
  <line x1="193" y1="84" x2="193" y2="118" stroke="#9dc4b2" marker-end="url(#h)"/>

  <rect x="150" y="120" width="150" height="36" rx="4" fill="#15402c" stroke="#5fe0a0"/>
  <text x="225" y="136" font-size="11" text-anchor="middle">spawns your body,</text>
  <text x="225" y="150" font-size="11" text-anchor="middle">parks an autopilot in it</text>

  <rect x="312" y="120" width="140" height="36" rx="4" fill="#15402c" stroke="#5fe0a0"/>
  <text x="382" y="136" font-size="11" text-anchor="middle">12 database trips:</text>
  <text x="382" y="150" font-size="11" text-anchor="middle">gear, skills, stats</text>

  <text x="250" y="222" font-size="11" fill="#9dc4b2" text-anchor="middle">...not even connected yet...</text>
  <rect x="466" y="202" width="80" height="32" rx="4" fill="#123526" stroke="#e0a34f"/>
  <text x="506" y="222" font-size="11" text-anchor="middle">HELLO...</text>

  <line x1="546" y1="218" x2="580" y2="160" stroke="#9dc4b2" marker-end="url(#h)"/>
  <rect x="540" y="116" width="126" height="44" rx="4" fill="#15402c" stroke="#e0a34f"/>
  <text x="603" y="134" font-size="11" text-anchor="middle">Possess:</text>
  <text x="603" y="150" font-size="11" text-anchor="middle">autopilot out, you in</text>

  <text x="24" y="272" font-size="11.5" fill="#9dc4b2">The room is made up and your bags are in it before you reach the front desk.</text>
  <text x="24" y="290" font-size="11.5" fill="#9dc4b2">Checking in isn't "build me a room", it's "swap housekeeping's key for mine".</text>
</svg>
