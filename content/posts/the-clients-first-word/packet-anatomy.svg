<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <rect width="680" height="230" rx="6" fill="#0b2a1d"/>
  <text x="24" y="30" font-size="14" fill="#5fe0a0">One 53 byte packet, the client's first word</text>

  <rect x="24" y="52" width="92" height="56" fill="#15402c" stroke="#5fe0a0"/>
  <text x="70" y="76" font-size="12" text-anchor="middle">packet id</text>
  <text x="70" y="94" font-size="10.5" text-anchor="middle" fill="#9dc4b2">14 bits</text>

  <rect x="116" y="52" width="190" height="56" fill="#123526" stroke="#5fe0a0"/>
  <text x="211" y="72" font-size="12" text-anchor="middle">bunch header</text>
  <text x="211" y="88" font-size="10.5" text-anchor="middle" fill="#9dc4b2">flags, channel, sequence,</text>
  <text x="211" y="101" font-size="10.5" text-anchor="middle" fill="#9dc4b2">length = 42</text>

  <rect x="306" y="52" width="316" height="56" fill="#0f2e21" stroke="#5fe0a0"/>
  <text x="464" y="78" font-size="11.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HELLO P=1 REVISION=0 MINVER=2327 VER=2797</text>
  <text x="464" y="96" font-size="10.5" text-anchor="middle" fill="#9dc4b2">plain English. 41 letters and a zero byte = 42</text>

  <rect x="622" y="52" width="34" height="56" fill="#15402c" stroke="#5fe0a0"/>
  <text x="639" y="84" font-size="10" text-anchor="middle">1</text>

  <g font-size="11" fill="#9dc4b2">
    <text x="24" y="140">The packet id ticks up by one every packet, keep alives included. That's how you know it's one conversation.</text>
    <text x="24" y="162">The header is Unreal's envelope. The client's own copy of it became my template for writing replies.</text>
    <text x="24" y="184">Every packet ends in a single 1 bit then zero padding, so "the last 1 bit" marks where the data really stops.</text>
    <text x="24" y="210" fill="#e0a34f">Not drawn to scale. Bits are small and I am not an artist.</text>
  </g>
</svg>
