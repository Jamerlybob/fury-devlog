<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <rect width="680" height="300" rx="6" fill="#0b2a1d"/>
  <text x="24" y="30" font-size="15" fill="#5fe0a0">One half of the game exists. I have to rebuild the other.</text>

  <!-- client column -->
  <rect x="24" y="52" width="290" height="210" rx="5" fill="#14432f" stroke="#5fe0a0"/>
  <text x="169" y="76" font-size="13" text-anchor="middle" fill="#5fe0a0">CLIENT: on your PC</text>
  <text x="169" y="94" font-size="10" text-anchor="middle" fill="#9dc4b2">I have this, all of it</text>
  <g font-size="11.5" fill="#e6efe8">
    <text x="44" y="124">&#8226; graphics, models, sounds</text>
    <text x="44" y="148">&#8226; menus and the character screen</text>
    <text x="44" y="172">&#8226; 38 maps, 6.4 GB of content</text>
    <text x="44" y="196">&#8226; compiled game script (.u files)</text>
    <text x="44" y="220">&#8226; the launcher and the patcher</text>
  </g>
  <text x="44" y="248" font-size="10" fill="#9dc4b2">boots on Windows 11, first try</text>

  <!-- server column -->
  <rect x="366" y="52" width="290" height="210" rx="5" fill="none" stroke="#e0a34f" stroke-dasharray="5 4"/>
  <text x="511" y="76" font-size="13" text-anchor="middle" fill="#e0a34f">SERVER: the company's machines</text>
  <text x="511" y="94" font-size="10" text-anchor="middle" fill="#9dc4b2">gone since 2008, rebuild from scratch</text>
  <g font-size="11.5" fill="#e6efe8">
    <text x="386" y="124">&#8226; log in, authenticate an account</text>
    <text x="386" y="148">&#8226; matchmaking, realms, chat, guilds</text>
    <text x="386" y="172">&#8226; the match server itself</text>
    <text x="386" y="196">&#8226; the player and gear database</text>
    <text x="386" y="220">&#8226; every network message and format</text>
  </g>
  <text x="386" y="248" font-size="10" fill="#9dc4b2">no binary, no source, no docs</text>

  <!-- link -->
  <path d="M314 157 L366 157" stroke="#9dc4b2" fill="none" marker-end="url(#a)"/>
  <path d="M366 175 L314 175" stroke="#9dc4b2" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9dc4b2"/>
    </marker>
  </defs>
</svg>
