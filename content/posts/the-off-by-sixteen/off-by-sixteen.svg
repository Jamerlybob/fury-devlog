<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a34f"/></marker>
  </defs>
  <rect width="680" height="300" rx="6" fill="#0b2a1d"/>
  <text x="24" y="28" font-size="14" fill="#5fe0a0">Inside Engine.u: two ways to count the same object</text>

  <text x="24" y="62" font-size="12" fill="#9dc4b2">export table, counted by position:</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="24" y="72" width="60" height="34" fill="#15402c" stroke="#5fe0a0"/><text x="54" y="93">0</text>
    <rect x="84" y="72" width="60" height="34" fill="#15402c" stroke="#5fe0a0"/><text x="114" y="93">1</text>
    <rect x="144" y="72" width="110" height="34" fill="#3a2e14" stroke="#e0a34f"/><text x="199" y="87">16 entries that</text><text x="199" y="100">never got a NetIndex</text>
    <rect x="254" y="72" width="80" height="34" fill="#15402c" stroke="#5fe0a0"/><text x="294" y="93">...</text>
    <rect x="334" y="72" width="110" height="34" fill="#15402c" stroke="#5fe0a0"/><text x="389" y="93">5326</text>
    <rect x="444" y="72" width="80" height="34" fill="#15402c" stroke="#5fe0a0"/><text x="484" y="93">...</text>
    <rect x="524" y="72" width="132" height="34" fill="#1f5a3d" stroke="#5fe0a0" stroke-width="2"/><text x="590" y="87">5342</text><text x="590" y="100">the scoreboard</text>
  </g>

  <text x="24" y="150" font-size="12" fill="#9dc4b2">the scoreboard's own stored NetIndex field says:</text>
  <rect x="334" y="160" width="110" height="34" fill="#3a1f1f" stroke="#f2a5a5"/>
  <text x="389" y="181" font-size="11" text-anchor="middle">5326</text>
  <path d="M389 160 L389 108" stroke="#e0a34f" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="452" y="182" font-size="11" fill="#f2a5a5">points 16 slots early, at whatever lives there</text>

  <g font-size="11.5" fill="#9dc4b2">
    <text x="24" y="230">My server wrote the number using the stored field. The client read it as a position.</text>
    <text x="24" y="250">In ten of Fury's eleven script files, those two numbers are identical.</text>
    <text x="24" y="270">The eleventh is Engine.u, which is exactly where the first object I send lives.</text>
  </g>
</svg>
