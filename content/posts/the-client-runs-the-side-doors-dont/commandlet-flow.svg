<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <rect width="680" height="340" rx="6" fill="#0b2a1d"/>
  <text x="24" y="30" font-size="15" fill="#5fe0a0">What `Fury.exe server` actually does in this build</text>

  <!-- normal engine -->
  <text x="24" y="60" font-size="11" fill="#9dc4b2">on a normal Unreal Engine 3 build</text>
  <g font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">
    <rect x="24" y="70" width="150" height="34" rx="4" fill="none" stroke="#5fe0a0"/><text x="99" y="91">Fury.exe server</text>
    <path d="M176 87 L214 87" stroke="#5fe0a0" fill="none" marker-end="url(#c)"/>
    <rect x="216" y="70" width="190" height="34" rx="4" fill="none" stroke="#5fe0a0"/><text x="311" y="91">dispatch to a commandlet</text>
    <path d="M408 87 L446 87" stroke="#5fe0a0" fill="none" marker-end="url(#c)"/>
    <rect x="448" y="70" width="180" height="34" rx="4" fill="#14432f" stroke="#5fe0a0"/><text x="538" y="91">runs as a server</text>
  </g>

  <!-- this build -->
  <text x="24" y="152" font-size="11" fill="#e0a34f">on this shipped copy of Fury</text>
  <g font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">
    <rect x="24" y="162" width="150" height="40" rx="4" fill="none" stroke="#e0a34f"/><text x="99" y="186">Fury.exe server</text>
    <path d="M176 182 L206 182" stroke="#e0a34f" fill="none" marker-end="url(#d)"/>
    <rect x="208" y="162" width="198" height="40" rx="4" fill="none" stroke="#e0a34f"/><text x="307" y="179">take the first word,</text><text x="307" y="194" font-size="9">load a MAP named "server"</text>
    <path d="M408 182 L438 182" stroke="#e0a34f" fill="none" marker-end="url(#d)"/>
    <rect x="440" y="162" width="188" height="40" rx="4" fill="none" stroke="#e0a34f"/><text x="534" y="179">no such map,</text><text x="534" y="194" font-size="9">crash dump</text>
    <path d="M534 202 L534 224" stroke="#e0a34f" fill="none" marker-end="url(#d)"/>
    <rect x="404" y="226" width="224" height="34" rx="4" fill="#3a1e12" stroke="#e0a34f"/><text x="516" y="247">relaunch the updater, "repair mode"</text>
  </g>

  <text x="24" y="238" font-size="11" fill="#e6efe8">Same story for `editor`,</text>
  <text x="24" y="256" font-size="11" fill="#e6efe8">`make`, and the file-check mode.</text>

  <line x1="24" y1="284" x2="656" y2="284" stroke="#2e5c46"/>
  <text x="24" y="308" font-size="11" fill="#9dc4b2">The commandlet machinery was pulled out before this copy shipped. Four developer doors, all bricked.</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fe0a0"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0a34f"/></marker>
  </defs>
</svg>
