<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" fill="#e6efe8">
  <rect width="680" height="250" rx="6" fill="#0b2a1d"/>
  <text x="24" y="28" font-size="14" fill="#5fe0a0">Sending the number 1 as a function argument</text>

  <text x="24" y="64" font-size="12" fill="#f2a5a5">what my server sent:</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="200" y="46" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="215" y="66">1</text>
    <rect x="230" y="46" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="245" y="66">0</text>
    <rect x="260" y="46" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="275" y="66">0</text>
    <rect x="290" y="46" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="305" y="66">0</text>
    <rect x="320" y="46" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="335" y="66">...</text>
  </g>
  <text x="370" y="66" font-size="11.5" fill="#9dc4b2">the value, straight away</text>

  <text x="24" y="118" font-size="12" fill="#e0a34f">what the game read:</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="200" y="100" width="30" height="30" fill="#3a2e14" stroke="#e0a34f"/><text x="215" y="120">1</text>
    <rect x="230" y="100" width="30" height="30" fill="#3a1f1f" stroke="#f2a5a5"/><text x="245" y="120">0</text>
    <rect x="260" y="100" width="30" height="30" fill="#3a1f1f" stroke="#f2a5a5"/><text x="275" y="120">0</text>
    <rect x="290" y="100" width="30" height="30" fill="#3a1f1f" stroke="#f2a5a5"/><text x="305" y="120">0</text>
    <rect x="320" y="100" width="30" height="30" fill="#3a1f1f" stroke="#f2a5a5"/><text x="335" y="120">...</text>
  </g>
  <text x="370" y="112" font-size="11.5" fill="#9dc4b2">"is this argument here?" yes</text>
  <text x="370" y="128" font-size="11.5" fill="#f2a5a5">then the value, one bit late: 0</text>

  <text x="24" y="172" font-size="12" fill="#5fe0a0">what it should have been:</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="200" y="154" width="30" height="30" fill="#3a2e14" stroke="#e0a34f"/><text x="215" y="174">1</text>
    <rect x="230" y="154" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="245" y="174">1</text>
    <rect x="260" y="154" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="275" y="174">0</text>
    <rect x="290" y="154" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="305" y="174">0</text>
    <rect x="320" y="154" width="30" height="30" fill="#15402c" stroke="#5fe0a0"/><text x="335" y="174">...</text>
  </g>
  <text x="370" y="174" font-size="11.5" fill="#9dc4b2">tick box first, then the value</text>

  <text x="24" y="216" font-size="11.5" fill="#9dc4b2">Every argument that isn't a yes/no gets a one bit "is this here?" box in front of it.</text>
  <text x="24" y="234" font-size="11.5" fill="#9dc4b2">Miss it, and every argument after it is read one bit late, which turns most numbers into nonsense.</text>
</svg>
