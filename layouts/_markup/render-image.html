{{- /* PaperMod's render-image hook, plus a <figure>/<figcaption> wrapper when
       the image has alt text. Keep in sync with
       themes/PaperMod/layouts/_markup/render-image.html */ -}}
{{- $u := urls.Parse .Destination -}}
{{- $src := $u.String -}}
{{- if not $u.IsAbs -}}
  {{- $path := strings.TrimPrefix "./" $u.Path }}
  {{- with or (.PageInner.Resources.Get $path) (resources.Get $path) -}}
    {{- $src = .RelPermalink -}}
    {{- with $u.RawQuery -}}
      {{- $src = printf "%s?%s" $src . -}}
    {{- end -}}
    {{- with $u.Fragment -}}
      {{- $src = printf "%s#%s" $src . -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $attributes := merge .Attributes (dict "alt" .Text "src" $src "title" (.Title | transform.HTMLEscape) "loading" "lazy") -}}
{{- $hasCaption := ne (trim .Text " ") "" -}}
{{- if $hasCaption }}<figure class="post-figure">{{ end -}}
<img
  {{- range $k, $v := $attributes -}}
    {{- if $v -}}
      {{- printf " %s=%q" $k $v | safeHTMLAttr -}}
    {{- end -}}
  {{- end -}}>
{{- if $hasCaption }}<figcaption>{{ .Text | safeHTML }}</figcaption></figure>{{ end -}}
{{- /**/ -}}
